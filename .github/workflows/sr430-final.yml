name: SR430 final closure and freeze verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['.github/workflows/sr430-final.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Production core model scheduler and closure regression
        run: |
          mkdir -p build/release430
          set -o pipefail
          bash tools/test_ramp39_model.sh 2>&1 | tee build/release430/core-model.log
          CP=build/ramp39-core/classes:build/ramp39-model/classes:src/main/resources
          javac --release 17 -encoding UTF-8 -cp "$CP" -d build/ramp39-core/classes src/validation/java/com/sora/splineroads/Closure430Validation.java
          for t in com.sora.splineroads.Closure430Validation com.sora.splineroads.world.Hotfix430ModelValidation com.sora.splineroads.world.Directional427ModelValidation com.sora.splineroads.world.Finish428ModelValidation com.sora.splineroads.world.Hotfix429ModelValidation; do
            java -Dfile.encoding=UTF-8 -Xmx1500m -cp "$CP" "$t" 2>&1 | tee "build/release430/$t.log"
          done
          python tools/test_scheduler430.py 2>&1 | tee build/release430/scheduler.log
      - name: Actual Java17 Forge build
        run: |
          set -o pipefail
          bash gradlew --no-daemon compileJava compileGameTestJava jar 2>&1 | tee build/release430/forge.log
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/libs/splineroads-0.40.18-alpha.jar') as z:
              assert 'Implementation-Version: 0.40.18-alpha' in z.read('META-INF/MANIFEST.MF').decode()
              assert 'version="0.40.18-alpha"' in z.read('META-INF/mods.toml').decode()
          PY
          cp build/libs/splineroads-0.40.18-alpha.jar build/release430/
      - name: Exact source and checksums
        if: always()
        run: |
          mkdir -p build/release430
          git rev-parse HEAD > build/release430/COMMIT.txt
          git archive --format=zip --output=build/release430/SplineRoads-0.40.18-alpha-source.zip HEAD
          sha256sum build/release430/*.jar build/release430/*source.zip > build/release430/SHA256.txt 2>/dev/null || true
          find build -name compile.log -exec sh -c 'for p; do echo "=== $p ==="; cat "$p"; done' sh {} + > build/release430/compilation-details.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr430-final-install-source-${{ github.sha }}
          path: build/release430/
          retention-days: 30
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Same real ADD and temporary merge fixtures after null-frame repair
        run: |
          mkdir -p build/repro430 run430
          echo eula=true > run430/eula.txt
          (for i in $(seq 1 24); do sleep 20; for p in $(jcmd -l | awk '/BootstrapLauncher/ {print $1}'); do jcmd "$p" Thread.print > "build/repro430/threads-$i-$p.txt" 2>&1 || true; done; done) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout 480s bash gradlew --no-daemon runGameTestServer -ProadRunDir=run430 -ProadTestNamespaces=splineroads_hotfix430 -ProadTestHeap=3G 2>&1 | tee build/repro430/server.log
          grep -q 'BUILD430 ADD_SAVE_DELETE_PASS' build/repro430/server.log
          grep -q 'BUILD430 TEMPORARY_DELETE_PASS' build/repro430/server.log
          grep -q 'All 2 required tests passed' build/repro430/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr430-final-minecraft-${{ github.sha }}
          path: |
            build/repro430/
            run430/logs/
            run430/*.xml
          retention-days: 30
