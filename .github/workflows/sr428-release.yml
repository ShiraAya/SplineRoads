name: SR15 integrated RC release verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['.github/workflows/sr428-release.yml', 'tools/check_sr428.sh']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/SR-0.40.15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual Forge and complete old and final integrated regression
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_sr428.sh 2>&1 | tee build/checkpoint-logs/sr428-final-full.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr428-final-source-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr428-final-jars-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
