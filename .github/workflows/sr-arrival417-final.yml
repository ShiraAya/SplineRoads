name: SR P1 arrival final validation
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/patches/arrival417-stage2.patch', '.github/workflows/sr-arrival417-final.yml']
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - id: save
        name: Save final reviewed source before tests
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          p=Path('tools/patches/arrival417-stage2.patch').read_bytes()
          assert hashlib.sha256(p).hexdigest()=='51f48f56c2b24c855f7e0e086f32fc3d4096f956d275d82177fff852ef9666f6'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=p,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=p,check=True)
          PY
          git diff --check
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src
          git commit -m 'fix: target closure boundaries, independent intakes, migration and preview reporting'
          git push origin HEAD:refs/heads/chat/sr-0402
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: All previous and focused arrival tests plus actual Forge build
        run: bash tools/check_arrival417.sh
      - name: Retain exact source even on failure
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-arrival417-final-source-logs
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-arrival417-final-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
