name: SR430 release verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['.github/workflows/sr430-release.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual Forge and full regression including user report
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_sr430.sh 2>&1 | tee build/checkpoint-logs/sr430-full.log
          python tools/test_scheduler430.py build/tunnel406/core/classes 2>&1 | tee build/checkpoint-logs/scheduler430.log
      - name: Preserve exact source and build checksums
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
          find build -name compile.log -exec sh -c 'for p; do echo "=== $p ==="; cat "$p"; done' sh {} + > build/checkpoint-logs/compilation-details.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr430-release-source-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr430-release-jars-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Real ServerLevel ADD save delete and temporary highway merge
        run: |
          mkdir -p build/repro430 run430
          echo eula=true > run430/eula.txt
          (for i in $(seq 1 27); do sleep 20; for p in $(jcmd -l | awk '/BootstrapLauncher/ {print $1}'); do jcmd "$p" Thread.print > "build/repro430/threads-$i-$p.txt" 2>&1 || true; done; done) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout 540s bash gradlew --no-daemon runGameTestServer -ProadRunDir=run430 -ProadTestNamespaces=splineroads_hotfix430 -ProadTestHeap=3G 2>&1 | tee build/repro430/server.log
          grep -q 'BUILD430 ADD_SAVE_DELETE_PASS' build/repro430/server.log
          grep -q 'BUILD430 TEMPORARY_DELETE_PASS' build/repro430/server.log
          grep -q 'All 2 required tests passed' build/repro430/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr430-release-minecraft-${{ github.sha }}
          path: |
            build/repro430/
            run430/logs/
            run430/*.xml
          retention-days: 30
