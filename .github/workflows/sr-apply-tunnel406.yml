name: Apply reviewed tunnel checkpoint once
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-apply-tunnel406.yml']
permissions:
  contents: read
jobs:
  apply:
    if: "github.repository == 'ShiraAya/SplineRoads' && github.event.head_commit.message == 'WIP: apply reviewed tunnel shell and excavation checkpoint'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact reviewed source
        run: python3 tools/checkpoints/apply_tunnel406.py
      - name: Save source before long tests
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/sora/splineroads/core/RoadInfrastructure.java src/main/java/com/sora/splineroads/world/RoadIndex.java PROGRESS.md
          git commit -m 'WIP: join tunnel arch sidewalls and restrict excavation to local interior'
          git push origin HEAD:refs/heads/chat/sr-0402
          git rev-parse HEAD > /tmp/sr-tunnel406-source
      - name: Actual geometry and adapted model index cache tests
        run: |
          set -euo pipefail
          mkdir -p build/checkpoint-logs
          bash tools/test_tunnel406.sh 2>&1 | tee build/checkpoint-logs/tunnel406.txt
      - name: Real Forge compile and reobfuscated JAR
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar 2>&1 | tee build/checkpoint-logs/forge.txt
      - name: Record passing tested checkpoint
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/sr-tunnel406-source)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PROGRESS.md');old=p.read_text();sha=Path('/tmp/sr-tunnel406-source').read_text().strip()
          p.write_text('# 任意车道保留分离及隧道针对性修复：生产已保存，真实CI通过\n\n最新生产保存点：`'+sha+'`。本次 tools/test_tunnel406.sh（包含Any405、R1-R4相关旧回归）及JDK17 Forge compileJava、compileGameTestJava、jar/reobfJar实际成功。112任意槽位几何/112规划案例，24隧道壳体/局部开挖场景。\n\n仍未实机Minecraft/光影/GPU、车辆或真实保存重进。U08/U09/U10/U11已修源码中的过宽空气预留及拱肩侧墙缺口，旧地形不承诺自动复原；U12远景虚空与其余9项仍未作为解决项。存档36/协议54/0.40.3-alpha，备份后同版本客户端服务端使用。\n\n---\n\n'+old)
          PY
          git add PROGRESS.md
          git commit -m 'docs: record any-lane and tunnel checkpoint passing full Forge build'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Preserve source and logs
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-tunnel406-checkpoint-${{ github.run_id }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-tunnel406-jar-${{ github.run_id }}
          path: build/libs/*.jar
          retention-days: 14
