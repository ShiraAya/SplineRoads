name: SR checkpoint validation
on:
  push:
    branches: [chat/sr-0402]
    paths: ['src/**', 'tools/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', 'gradlew', '.github/workflows/sr-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sr-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: P1 tunnel/seam checks, prior regressions and complete Forge build
        run: bash tools/check_tunnel415.sh
      - name: Retain original solid material and visibility binding checks
        run: |
          python - <<'PY'
          from pathlib import Path
          renderer=Path('src/main/java/com/sora/splineroads/client/RoadRenderer.java').read_text()
          assert 'RoadRenderTypes.solid(ResourceLocation.fromNamespaceAndPath("minecraft","textures/block/"+finish.id.substring(10)+".png"))' in renderer
          assert 'RoadVisibility.within' in renderer and 'event.getFrustum().isVisible' in renderer
          print('PASS: real solid sidewalk binding, bounded visibility and frustum preserved; no GPU test implied')
          PY
      - name: Preserve exact committed source
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-checkpoint-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-candidate-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
