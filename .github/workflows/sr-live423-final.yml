name: SR live feedback 0.40.15 final verification
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/check_live423.sh', 'tools/model-validation/com/sora/splineroads/world/Live423ModelValidation.java', '.github/workflows/sr-live423-final.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Complete old and screenshot regression plus actual Forge build
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_live423.sh 2>&1 | tee build/checkpoint-logs/live423-full.log
      - name: Preserve exact source and logs
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-live423-final-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-live423-final-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
