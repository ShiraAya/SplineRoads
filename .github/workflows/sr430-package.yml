name: SR430 exact release package
on:
  push:
    branches: [SR-0.40.15]
    paths: ['.github/workflows/sr430-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify unchanged Java and build installable release
        run: |
          mkdir -p build/release430
          git diff --exit-code 53bd527ad88a765e3478614f884f85063771a218 HEAD -- src/main/java src/gametest tools
          set -o pipefail
          bash gradlew --no-daemon compileJava compileGameTestJava jar 2>&1 | tee build/release430/forge-package.log
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('build/libs/splineroads-0.40.18-alpha.jar')
          with zipfile.ZipFile(p) as z:
              assert 'Implementation-Version: 0.40.18-alpha' in z.read('META-INF/MANIFEST.MF').decode()
              assert 'version="0.40.18-alpha"' in z.read('META-INF/mods.toml').decode()
              for name in ['net/RoadPlanningJobs','core/RoadPlanningBudget','core/RoadMedianAnchor','core/RoadMergeArrow']:
                  assert 'com/sora/splineroads/'+name+'.class' in z.namelist()
          print('JAR version and production hotfix classes verified')
          PY
          cp build/libs/splineroads-0.40.18-alpha.jar build/release430/
      - name: Exact source and evidence
        if: always()
        run: |
          mkdir -p build/release430
          git rev-parse HEAD > build/release430/COMMIT.txt
          git archive --format=zip --output=build/release430/SplineRoads-0.40.18-alpha-source.zip HEAD
          sha256sum build/release430/*.jar build/release430/*source.zip > build/release430/SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr430-install-source-${{ github.sha }}
          path: build/release430/
          retention-days: 30
          if-no-files-found: error
