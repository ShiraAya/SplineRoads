name: SR remaining Q2 consolidated baseline
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/patches/q2close422s1*', '.github/workflows/sr-q2close422-stage.yml']
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: save
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','16cebd055dcf69e2605b8e3244fe81dbb8c220b2','--','src','build.gradle'],check=True)
          data=''.join(Path('tools/patches/q2close422s1.xz64.'+str(i)).read_text() for i in range(2))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4c0721cb0ae368c9773e9e2efb309465e4b980d6ed18d981d22ce95a5605fe3a'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','add','--','src','build.gradle'],check=True)
          PY
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'WIP: persist all remaining Q2 code paths before comprehensive closure tests'
          git push origin HEAD:refs/heads/chat/sr-0402
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Existing complete regression and real Forge compile
        run: bash tools/check_grade421.sh
      - name: Save exact committed source and logs
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-q2close422s1-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-q2close422s1-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
