name: SR438 deletion recovery and rail continuity
on:
  push:
    branches: [chat/sr-04021-ramp-matrix]
    paths: ['src/**', 'tools/**', 'build.gradle', '.github/workflows/sr435-live-feedback.yml']
permissions:
  contents: read
concurrency:
  group: sr435-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and model regression
        run: bash tools/test_ramp39_model.sh
      - name: Screenshot geometry regression
        run: |
          bash tools/check_sr435.sh
          bash tools/check_sr436.sh
          bash tools/check_sr437.sh
          bash tools/check_sr438.sh
      - name: Full Forge build
        run: bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar
      - name: Save compiled installation package
        uses: actions/upload-artifact@v4
        with:
          name: sr438-build-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30
      - name: Real saved ramp recheck and broken-world deletion
        run: bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run438 -ProadTestNamespaces=splineroads_live438 -ProadTestHeap=3G
      - name: Real 32-case Minecraft build matrix
        run: bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run435 -ProadTestNamespaces=splineroads_matrix434 -ProadTestHeap=3G
      - name: Real fixed-east-end 32-case Minecraft matrix
        run: bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run435east -ProadTestNamespaces=splineroads_matrix434 -ProadMatrixEnd=east -ProadTestHeap=3G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr438-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/ramp39-core/logs/
            build/ramp39-model/logs/
            run438/logs/latest.log
            run435/logs/latest.log
            run435east/logs/latest.log
          retention-days: 30
