name: SR 0.40.6 small edit guard and final complete build
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/patch_0406_small_edits.json', '.github/workflows/sr-0406-small-edits.yml']
permissions:
  contents: write
jobs:
  save-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/sr-0402
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Save small edit guard before validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/apply_0406_exact.py tools/patch_0406_small_edits.json
          git config user.name 'SR checkpoint automation'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src/main/java/com/sora/splineroads/world/RoadData.java
          git commit -m 'perf: avoid spatial setup for small edits; select planning lookup by batch size'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Full old/new regression and actual Forge compilation
        run: bash tools/check_release0406.sh
      - name: Original material and visibility bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('src/main/java/com/sora/splineroads/client/RoadRenderer.java').read_text()
          assert 'RoadRenderTypes.solid(ResourceLocation.fromNamespaceAndPath("minecraft","textures/block/"+finish.id.substring(10)+".png"))' in r
          assert 'RoadVisibility.within' in r and 'event.getFrustum().isVisible' in r
          print('PASS: original solid/visibility bindings retained; no GPU test')
          PY
      - name: Preserve exact source even on failure
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-0406-final-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-0406-final-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
