name: SR P1 closed-lane solids final verification
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/apply_closure418_report.py', '.github/workflows/sr-closure418-final.yml']
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - id: save
        run: |
          python tools/apply_closure418_report.py
          git -c core.whitespace=cr-at-eol diff --check
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src
          git commit -m 'fix: report actual rectangular reopening boundary in connector preview'
          git push origin HEAD:refs/heads/chat/sr-0402
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Real Forge build and closure regressions
        run: bash tools/check_closure418.sh
      - name: Preserve exact source even on failure
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-closure418-final-source-logs
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-closure418-final-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
