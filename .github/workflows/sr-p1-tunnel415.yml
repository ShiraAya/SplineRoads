name: SR P1 tunnel boundary checkpoint
on:
  push:
    branches: [chat/sr-0402]
    paths: [tools/changes/tunnel415-stage1.json]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source and save before tests
        id: save
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$EXPECTED"
          python3 tools/changes/apply_tunnel415_stage1.py
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src/main/java tools/check_problem2_batch1.sh
          git commit -m 'WIP: exact tunnel interior and exterior terrain retention (P1 Q2-03/04/07)'
          git push origin HEAD:refs/heads/chat/sr-0402
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Previous full regressions and real Forge build
        run: bash tools/check_problem2_batch1.sh
      - name: Keep exact snapshot even if validation fails
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-tunnel415-stage1-source-logs
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-tunnel415-stage1-jar
          path: build/libs/*.jar
          retention-days: 14
