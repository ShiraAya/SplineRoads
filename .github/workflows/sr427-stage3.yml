name: SR15 directional lanes and live continuation verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['tools/patches/sr427-stage3.part1', 'tools/patches/sr427-stage3.part2', '.github/workflows/sr427-stage3.yml']
permissions:
  contents: read
jobs:
  preserve:
    if: github.ref == 'refs/heads/SR-0.40.15'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: save
        run: |
          git config core.whitespace blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','2e90ae6f8b4a81aea69997add03c6c05f8fbf79c','--','src','build.gradle','tools/check_sr427.sh'],check=True)
          data=''.join(Path('tools/patches/sr427-stage3.part'+str(i)).read_text() for i in (1,2))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='c8c796c0dfba94d0087aca5039e686d7c724801841bd111c80065c5daa9f3260'
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          p=Path('PROGRESS.md');old=p.read_text()
          p.write_text('# SR15 directional lanes and continuation — source saved, CI pending\n\n2026-10-06. Continued from 2e90ae6 without reverting stage1 repairs. Candidate 0.40.16-alpha-stage2, protocol61; branch SR-0.40.15 only.\n\nWritten: independent authored forward/reverse 1-4 lane counts, asymmetric cross-sections and NBT, lane configuration sliders, physical merged endpoint snapshots and continuation inheritance without double trimming the donor host. Local Directional427 core116 cases/2738 checks passed; full Forge and old regression pending at this commit. See docs/checkpoints/SR15-directional-427.md.\n\nCurrent review: reversed/one-way port semantics, roundtrip codec and ordinary RoadData/AutoJunction interactions. No original-world, Minecraft client/GPU or live network acceptance. SR15-03/07/08 remain pending. Do not treat old CI success as this candidate acceptance.\n\n---\n## Historical checkpoint\n'+old)
          subprocess.run(['git','add','--','src','build.gradle','tools/check_sr427.sh','docs/checkpoints/SR15-directional-427.md','PROGRESS.md'],check=True)
          PY
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat: independent direction lane configuration and live merged endpoint continuation'
          git push origin HEAD:refs/heads/SR-0.40.15
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual Forge build and full old/new regression
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_sr427.sh 2>&1 | tee build/checkpoint-logs/sr427-full.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr427-source-logs-${{ needs.preserve.outputs.saved }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr427-jars-${{ needs.preserve.outputs.saved }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
