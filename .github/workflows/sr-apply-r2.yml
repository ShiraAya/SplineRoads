name: Apply reviewed R2 checkpoint once
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-apply-r2.yml']
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: >-
      github.repository == 'ShiraAya/SplineRoads' && github.event.head_commit.message == 'chore: stage reviewed R2 edits for guarded source checkpoint'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact reviewed source hashes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$GITHUB_SHA"
          mkdir -p build/r2-checkpoint-logs
          python3 tools/checkpoints/apply_r2.py 2>&1 | tee build/r2-checkpoint-logs/source-hashes.txt
          git -c core.whitespace=cr-at-eol diff --cached --check
      - name: Real core and explicit model regression
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test_transition402.sh 2>&1 | tee build/r2-checkpoint-logs/transitions.txt
          bash tools/test_bidirectional402.sh 2>&1 | tee build/r2-checkpoint-logs/bidirectional.txt
      - name: Actual Forge compile and candidate JAR
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --stacktrace --max-workers=2 compileJava compileGameTestJava jar 2>&1 | tee build/r2-checkpoint-logs/forge.txt
      - name: Commit tested source without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/checkpoints/apply_r2.py --verify-after
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$GITHUB_SHA"
          cp PROGRESS.md docs/checkpoints/R2-staging-progress.md
          printf '# SR checkpoint: R1 + R2 source implemented and compiled\n\nR1: dbb0e73970d90f7f084904093008f8928dd8766f. R2: this source commit.\n\nThe 11 production edits match docs/checkpoints/R2-source-manifest.json exactly. Core transition, bidirectional geometry/planner, previous hotfix regression, and real JDK17 Forge compileJava/compileGameTestJava/jar all succeeded before this commit. See Actions run %s and its preserved logs. No Minecraft/GPU/world placement tests were run.\n\nR2 supports outermost lane of each direction; opposing lane axes and world median stay fixed. Internal arbitrary lane cuts and cross-segment reservations remain unsupported.\n\nR3 temporary closure/reopening and R4 VBO/terrain warm cache are NOT implemented. Next stage R3, per docs/CURRENT_REQUIREMENTS.md. Preserve user compile fixes; no broad safety bypasses.\n\nEarlier staging history: docs/checkpoints/R2-staging-progress.md. Session start 2026-10-05T11:08:54Z; wrap near 45 minutes and pause at the observable 50-minute checkpoint.\n' "$GITHUB_RUN_ID" > PROGRESS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROGRESS.md docs/checkpoints/R2-staging-progress.md
          git commit -m 'fix: two-way outer-lane detach preserves opposing traffic and median (R2)'
          git push origin HEAD:refs/heads/chat/sr-0402
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD | tee build/r2-checkpoint-logs/verified-remote-commit.txt
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-r2-checkpoint-logs-${{ github.run_id }}
          path: build/r2-checkpoint-logs/
          retention-days: 14
      - name: Preserve compiled checkpoint JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sr-r2-candidate-jar-${{ github.run_id }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
