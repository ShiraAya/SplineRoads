name: Apply reviewed any-lane checkpoint once
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-apply-any405.yml']
permissions:
  contents: read
jobs:
  apply:
    if: "github.repository == 'ShiraAya/SplineRoads' && github.event.head_commit.message == 'WIP: apply reviewed any-lane temporary separation checkpoint'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact reviewed source with guards
        run: python3 tools/checkpoints/apply_any405.py
      - name: Save source before long tests
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle tools/test_any405.sh tools/model-validation/com/sora/splineroads/world/AnyLane405ModelValidation.java tools/checkpoints/any405.payload PROGRESS.md
          git commit -m 'WIP: support temporary separation of any selected lane with physical deck openings'
          git push origin HEAD:refs/heads/chat/sr-0402
          git rev-parse HEAD > /tmp/sr-any405-source
      - name: Core and explicit model cache regression
        run: |
          set -euo pipefail
          mkdir -p build/checkpoint-logs
          bash tools/test_any405.sh 2>&1 | tee build/checkpoint-logs/any405.txt
      - name: Real Forge compile and reobfuscated JAR
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar 2>&1 | tee build/checkpoint-logs/forge.txt
      - name: Record actual passing checkpoint
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/sr-any405-source)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PROGRESS.md');old=p.read_text();sha=Path('/tmp/sr-any405-source').read_text().strip()
          p.write_text('# 任意车道保留分离：源码已保存，本次真实CI通过\n\n生产保存点：`'+sha+'`。本次实际通过 tools/test_any405.sh 和 JDK17 Forge compileJava/compileGameTestJava/jar/reobfJar。112个任意槽位几何案例与112个生产规划/记录/删除案例，DETACH原限制回归保留；模型世界/NBT为测试适配器，未做实际Minecraft/GPU/真实存盘重进。\n\n存档36/协议54/0.40.3-alpha。13项文档问题仍需单独处理。\n\n---\n\n'+old)
          PY
          git add PROGRESS.md
          git commit -m 'docs: record any-lane temporary separation passing real Forge checkpoint'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Preserve source and logs even on failure
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-any405-checkpoint-${{ github.run_id }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-any405-jar-${{ github.run_id }}
          path: build/libs/*.jar
          retention-days: 14
