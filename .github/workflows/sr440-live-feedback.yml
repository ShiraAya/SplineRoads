name: SR440 live feedback verification
on:
  push:
    branches: [work/sr-04027-live-feedback]
    paths: ['src/**', 'tools/**', 'build.gradle', '.github/workflows/sr440-live-feedback.yml']
permissions:
  contents: read
concurrency:
  group: sr440-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full Forge build
        run: bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar
      - uses: actions/upload-artifact@v4
        with:
          name: sr440-build-${{ github.sha }}
          path: build/libs/*.jar
      - name: Core and model regression
        run: bash tools/test_ramp39_model.sh
      - name: New screenshot regression
        run: |
          bash tools/check_sr439.sh
          bash tools/check_sr440.sh
      - name: Real request publication, underground and tunnel regression
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run440terrain -ProadTestNamespaces=splineroads_live440 -ProadTestHeap=3G | tee run440terrain-console.log
          grep -q 'LIVE440 REAL_WORLD PASS' run440terrain-console.log
      - name: Real Minecraft build matrix
        run: bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run440 -ProadTestNamespaces=splineroads_matrix434 -ProadTestHeap=3G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr440-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/ramp39-core/logs/
            build/ramp39-model/logs/
            run440/logs/latest.log
            run440terrain/logs/latest.log
            run440terrain-console.log
