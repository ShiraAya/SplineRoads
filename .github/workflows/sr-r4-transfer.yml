name: R4 transfer byte check
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-r4-transfer.yml']
permissions:
  contents: read
jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r4-transfer-${{ github.run_id }}
          path: tools/checkpoints/r4-production.patch.z64
          retention-days: 14
