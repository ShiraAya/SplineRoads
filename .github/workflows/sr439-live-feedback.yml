name: SR439 live feedback verification
on:
  push:
    branches: [chat/sr-04026-live-feedback]
    paths: ['src/**', 'tools/**', 'build.gradle', '.github/workflows/sr439-live-feedback.yml']
permissions:
  contents: read
concurrency:
  group: sr439-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full Forge build
        run: bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar
      - uses: actions/upload-artifact@v4
        with:
          name: sr439-build-${{ github.sha }}
          path: build/libs/*.jar
      - name: Core and model regression
        run: bash tools/test_ramp39_model.sh
      - name: New screenshot regression
        run: bash tools/check_sr439.sh
      - name: Real terrain and mouth regression
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run439terrain -ProadTestNamespaces=splineroads_live439 -ProadTestHeap=3G | tee run439terrain-console.log
          grep -q 'LIVE439 REAL_WORLD PASS' run439terrain-console.log
      - name: Real Minecraft build matrix
        run: bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run439 -ProadTestNamespaces=splineroads_matrix434 -ProadTestHeap=3G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr439-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/ramp39-core/logs/
            build/ramp39-model/logs/
            run439/logs/latest.log
            run439terrain/logs/latest.log
            run439terrain-console.log
