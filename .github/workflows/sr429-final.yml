name: SR429 final hotfix verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['.github/workflows/sr429-final.yml', 'src/main/java/com/sora/splineroads/world/RoadContinuations.java']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual Forge and full regression
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_sr429.sh 2>&1 | tee build/checkpoint-logs/sr429-full.log
      - name: Preserve exact source
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr429-final-source-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr429-final-jars-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual ServerLevel normal road and ADD ramp construction
        run: |
          mkdir -p build/repro429 run429
          echo eula=true > run429/eula.txt
          (for i in $(seq 1 20); do sleep 25; for p in $(jcmd -l | awk '/BootstrapLauncher/ {print $1}'); do jcmd "$p" Thread.print > "build/repro429/threads-$i-$p.txt" 2>&1 || true; done; done) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout 480s bash gradlew --no-daemon runGameTestServer -ProadRunDir=run429 -ProadTestNamespaces=splineroads_hotfix429 -ProadTestHeap=3G -Proad429Arrival=ADD 2>&1 | tee build/repro429/server.log
          grep -q 'BUILD429 CONTINUATION_REAL_WORLD_MS=' build/repro429/server.log
          grep -q 'BUILD429 RAMP_REAL_WORLD_MS=' build/repro429/server.log
          grep -q 'All 2 required tests passed' build/repro429/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr429-final-minecraft-${{ github.sha }}
          path: |
            build/repro429/
            run429/logs/
            run429/*.xml
          retention-days: 30
