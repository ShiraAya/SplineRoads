name: SR15 first repair candidate full verification
on:
  push:
    branches: [SR-0.40.15]
    paths: ['tools/patches/sr426-stage2.xz64', '.github/workflows/sr426-stage2.yml']
permissions:
  contents: read
jobs:
  preserve:
    if: github.ref == 'refs/heads/SR-0.40.15'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: save
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','76e4c9fe2f9ea1a839571127e355327c2fe91c5e','--','src','tools/check_sr425.sh','tools/model-test-support','tools/model-validation','build.gradle'],check=True)
          patch=lzma.decompress(base64.b64decode(Path('tools/patches/sr426-stage2.xz64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='fdafa4522c80250bfae55b2bb27eb34cfbb3e1b54aaf5b5320e184c4d46c8da5'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('PROGRESS.md');old=p.read_text()
          p.write_text('# SR-0.40.15 repair — first candidate saved, full CI pending\n\nUser authorized implementation on 2026-10-06. Candidate version 0.40.16-alpha-stage1; branch remains SR-0.40.15.\n\nStage1 actual RoadIndex reference/mesh preservation and live lane identity are retained. Stage2 corrects the closed-neighbor receiver guard found by the first full CI, adds union planter end caps, exposed hole-end rails, upstream X warnings, whole-span corridor targets and readable failure details. Actual continuation and asymmetric creation UI remain unfinished. See docs/checkpoints/SR15-stage2-426.md for all 14 statuses.\n\nRun bash tools/check_sr426.sh. Full Java17 Forge and regression result is pending at this commit; no Minecraft runtime/original world acceptance. Stage1 run 37473665897 compiled with Forge but failed a genuine receiver-protection regression; that production guard was corrected and the unchanged rejection test passed locally. Do not label the failed stage1 run a full success.\n\nNext priority: SR15-09/10 endpoint continuation against current physical cross-sections without double trimming authored geometry; SR15-11 per-direction 1-4 lane controls; then SR15-03/07/08. No other branch modified.\n\n---\n## Historical checkpoint\n'+old)
          subprocess.run(['git','add','--','src','build.gradle','tools/check_sr426.sh','tools/model-test-support','tools/model-validation','docs/checkpoints/SR15-stage2-426.md','PROGRESS.md'],check=True)
          PY
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: smooth whole-span grades and close planting and lane-hole safety ends'
          git push origin HEAD:refs/heads/SR-0.40.15
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual Forge build and complete regression
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_sr426.sh 2>&1 | tee build/checkpoint-logs/sr426-full.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr426-source-logs-${{ needs.preserve.outputs.saved }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr426-jars-${{ needs.preserve.outputs.saved }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
