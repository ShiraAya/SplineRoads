name: SR 0.40.6 spatial planning and complete build
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/patch_0406_stage2.json', '.github/workflows/sr-0406-stage2.yml']
permissions:
  contents: write
jobs:
  save-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/sr-0402
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Save exact production integration first
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/apply_0406_exact.py tools/patch_0406_stage2.json
          git config user.name 'SR checkpoint automation'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src/main/java src/main/resources/META-INF/mods.toml build.gradle
          git commit -m 'perf: reuse ordered local planning candidates during each road edit; release 0.40.6'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Prior regression suite, new parity checks and real Forge compile
        run: bash tools/check_release0406.sh
      - name: Always preserve exact source
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-0406-source-logs-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-0406-compiled-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
