name: SR 0.40.6 one-pass raster checkpoint
on:
  push:
    branches: [chat/sr-0402]
    paths: ['tools/patch_0406_stage1.json', '.github/workflows/sr-0406-stage1.yml']
permissions:
  contents: write
jobs:
  save-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/sr-0402
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Save reviewed production files before long tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/apply_0406_exact.py tools/patch_0406_stage1.json
          git config user.name 'SR checkpoint automation'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git add src/main/java
          git commit -m 'perf: raster furniture once for collision and tagged metadata; reuse terrain shape'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Production index and new raster parity checks
        run: |
          set -euo pipefail
          mkdir -p build/checkpoint-logs
          bash tools/test_perf40.sh 2>&1 | tee build/checkpoint-logs/stage1.txt
          CP=build/perf40/core/classes:src/main/resources
          javac --release 17 -encoding UTF-8 -cp "$CP" -d build/perf40/core/classes src/validation/java/com/sora/splineroads/StructureRaster412Validation.java
          java -Xmx1500m -XX:ActiveProcessorCount=2 -cp "$CP" com.sora.splineroads.StructureRaster412Validation | tee build/checkpoint-logs/raster412.txt
      - name: Always preserve exact source
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-0406-stage1-${{ github.sha }}
          path: build/checkpoint-logs/
          retention-days: 14
