name: Apply reviewed R4 checkpoint once
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-apply-r4.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ShiraAya/SplineRoads' && startsWith(github.event.head_commit.message, 'WIP')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate and apply exact reviewed source
        run: python3 tools/checkpoints/apply_r4.py
      - name: Save source before long tests
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle tools
          git commit -m 'WIP: reuse shared road geometry and bounded terrain/VBO variants (R4)'
          git push origin HEAD:refs/heads/chat/sr-0402
          git rev-parse HEAD > /tmp/sr-r4-source-sha
      - name: Actual core and explicit cache tests
        run: |
          set -euo pipefail
          mkdir -p build/checkpoint-logs
          bash tools/test_warm404.sh 2>&1 | tee build/checkpoint-logs/r4.txt
      - name: Actual Forge compile and reobfuscated JAR
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar 2>&1 | tee build/checkpoint-logs/forge.txt
      - name: Record tested checkpoint
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/sr-r4-source-sha)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PROGRESS.md');old=p.read_text();source=Path('/tmp/sr-r4-source-sha').read_text().strip()
          p.write_text('# R3/R4 已保存并通过真实Forge编译\n\nR4生产提交：`'+source+'`。本轮开始2026-10-05T12:01:41Z。\n\n已通过 tools/test_warm404.sh（包含R1/R2/R3回归与100对后端切换的实际terrain缓存代码测试），以及 JDK17 Forge compileJava、compileGameTestJava、jar/reobfJar。无真实客户端/光影/GPU/世界重进测试。\n\nR3按匝道路面及结构空间恢复车道，旧BRANCH保持原有直行分流语义；存档35、协议53，必须备份世界并同步更新。R4共用几何，休眠terrain和顶点格式VBO缓存默认各64MiB估算预算，真实改动与资源变化仍失效。\n\n13项新增问题全部记录于 docs/issues/2026-10-05-user-report.md；未完成项不能因R3/R4通过而标成已修复。下一步逐项处理隧道/人行道/设施及性能问题。\n\n---\n\n## 之前检查点\n\n'+old)
          PY
          git add PROGRESS.md
          git commit -m 'docs: record verified R3/R4 source and real Forge build'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Preserve source and logs
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-r4-checkpoint-${{ github.run_id }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-r4-jar-${{ github.run_id }}
          path: build/libs/*.jar
          retention-days: 14
