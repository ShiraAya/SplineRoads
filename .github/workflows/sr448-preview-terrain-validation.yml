name: SR448 cached preview and live geometry regression
on:
  push:
    branches: [work/sr-04034-preview-terrain]
    paths: ['src/**', 'tools/**', 'build.gradle', '.github/workflows/sr448-preview-terrain-validation.yml']
permissions:
  contents: read
concurrency:
  group: sr448-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full Forge build
        run: bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar
      - uses: actions/upload-artifact@v4
        with:
          name: sr448-build-${{ github.sha }}
          path: build/libs/*.jar
      - name: Core and model regression
        run: bash tools/test_ramp39_model.sh
      - name: New screenshot regression
        run: |
          bash tools/check_sr439.sh
          bash tools/check_sr440.sh
          bash tools/check_sr441.sh
          bash tools/check_sr442.sh
          bash tools/check_sr443.sh
          bash tools/check_sr444.sh
          bash tools/check_sr445.sh
          bash tools/check_sr435.sh
          bash tools/check_sr438.sh
      - name: Live447 core, terrain cache and original endpoint regressions
        run: |
          set -o pipefail
          bash tools/check_sr447.sh
          bash tools/check_sr448.sh
          bash tools/check_terrain448.sh
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run448 -ProadTestNamespaces=splineroads_live448 -ProadTestHeap=3G | tee run448-console.log
          test "$(grep -c 'LIVE448 REAL_WORLD PASS' run448-console.log)" -eq 2
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run447 -ProadTestNamespaces=splineroads_live447 -ProadTestHeap=3G | tee run447-console.log
          test "$(grep -c 'LIVE447 REAL_WORLD PASS' run447-console.log)" -eq 2
          grep -q 'LIVE447 CANCEL PASS' run447-console.log
          grep -q 'LIVE448 GUARDRAIL_WIDTH PASS' run447-console.log
      - name: Seven-image bridge, ground, branch and stability regression
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run441 -ProadTestNamespaces=splineroads_live441 -ProadTestHeap=3G | tee run441-console.log
          grep -q 'LIVE441 REAL_WORLD PASS ground=false' run441-console.log
          grep -q 'LIVE441 REAL_WORLD PASS ground=true roomy=false' run441-console.log
          grep -q 'LIVE441 REAL_WORLD PASS ground=true roomy=true' run441-console.log
          test "$(grep -c 'LIVE441 REAL_WORLD PASS' run441-console.log)" -eq 5
          grep -q 'LIVE441 REAL_WORLD PASS branch:' run441-console.log
          grep -q 'LIVE441 REAL_WORLD PASS bank:' run441-console.log
      - name: Local tunnel and original terrain policy regression
        run: |
          set -o pipefail
          bash tools/check_sr446.sh
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run446 -ProadTestNamespaces=splineroads_live446 -ProadTestHeap=3G | tee run446-console.log
          test "$(grep -c 'LIVE446 REAL_WORLD PASS' run446-console.log)" -eq 3
      - name: Save-derived temporary self-host and real build regression
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run445 -ProadTestNamespaces=splineroads_live445 -ProadTestHeap=3G | tee run445-console.log
          grep -q 'LIVE445 REAL_WORLD PASS' run445-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr448-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            run447-console.log
            run447/logs/latest.log
            build/terrain448/logs/
            run448-console.log
            run448/logs/latest.log
            build/ramp39-core/logs/
            build/ramp39-model/logs/
            run440/logs/latest.log
            run440terrain/logs/latest.log
            run440terrain-console.log
            run441/logs/latest.log
            run441-console.log
            run442/logs/latest.log
            run442-console.log
            run443/logs/latest.log
            run443-console.log
            run444/logs/latest.log
            run444-console.log
            run446/logs/latest.log
            run446-console.log
            run445/logs/latest.log
            run445-console.log

  legacy-worlds:
    name: Existing structure and rebuild worlds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Thirteen-image actual structure planning and candidate fallback
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run444 -ProadTestNamespaces=splineroads_live444 -ProadTestHeap=3G | tee run444-console.log
          grep -q 'LIVE444 REAL_SERVER PASS' run444-console.log
      - name: Exact support planning on the Minecraft server
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run443 -ProadTestNamespaces=splineroads_live443 -ProadTestHeap=3G | tee run443-console.log
          grep -q 'LIVE443 REAL_SERVER PASS' run443-console.log
      - name: Real detach, continuation, deletion and rebuild sequence
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run442 -ProadTestNamespaces=splineroads_live442 -ProadTestHeap=3G | tee run442-console.log
          grep -q 'LIVE442 REAL_WORLD PASS continuation:' run442-console.log
      - name: Real request publication, underground and tunnel regression
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run440terrain -ProadTestNamespaces=splineroads_live440 -ProadTestHeap=3G | tee run440terrain-console.log
          grep -q 'LIVE440 REAL_WORLD PASS' run440terrain-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr447-existing-worlds-${{ github.sha }}
          path: |
            run444-console.log
            run443-console.log
            run442-console.log
            run440terrain-console.log
            run444/logs/latest.log
            run443/logs/latest.log
            run442/logs/latest.log
            run440terrain/logs/latest.log

  matrix:
    name: Minecraft matrix row ${{ matrix.row }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        row: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Real Minecraft preview build save delete matrix
        run: |
          set -o pipefail
          bash gradlew --no-daemon --max-workers=2 runGameTestServer -x downloadAssets -ProadRunDir=run441matrix -ProadTestNamespaces=splineroads_matrix434 -ProadMatrixRow=${{ matrix.row }} -ProadTestHeap=3G | tee matrix-${{ matrix.row }}.log
          grep -q 'MATRIX434 SUMMARY 8/8' matrix-${{ matrix.row }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr447-matrix-${{ matrix.row }}-${{ github.sha }}
          path: |
            matrix-${{ matrix.row }}.log
            run441matrix/logs/latest.log
