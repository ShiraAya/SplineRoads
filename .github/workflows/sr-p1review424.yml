name: SR-0.40.14 P1 repair verification
on:
  push:
    branches: [SR-0.40.14]
    paths: ['tools/patches/p1review424.xz64', '.github/workflows/sr-p1review424.yml']
permissions:
  contents: read
jobs:
  preserve:
    if: github.ref == 'refs/heads/SR-0.40.14'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 3
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: save
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','a6951038e5ff9671e1f1a14ded006caad98b9ab7','--','src','build.gradle','PROGRESS.md'],check=True)
          patch=lzma.decompress(base64.b64decode(Path('tools/patches/p1review424.xz64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a846d30cfe5b553eafe87d4cc7680933101a65a3fd94f34e4a5e9889097819be'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','add','--','src','build.gradle','PROGRESS.md','tools/check_p1review424.sh'],check=True)
          PY
          git config user.name 'SR checkpoint'
          git config user.email 'sr-checkpoint@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: preserve signed monotone grades, feasible path budgets and complete unioned planting beds'
          git push origin HEAD:refs/heads/SR-0.40.14
          echo "saved=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.saved }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Complete old and new regression plus actual Forge build
        run: |
          mkdir -p build/checkpoint-logs
          set -o pipefail
          bash tools/check_p1review424.sh 2>&1 | tee build/checkpoint-logs/p1review424-full.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
          sha256sum build/libs/*.jar > build/checkpoint-logs/JAR-SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-p1review424-source-logs-${{ needs.preserve.outputs.saved }}
          path: build/checkpoint-logs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-p1review424-jar-${{ needs.preserve.outputs.saved }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
