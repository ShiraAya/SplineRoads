name: SR P1 batch final validation
on:
  push:
    branches: [chat/sr-0402]
    paths: [.github/workflows/sr-problem2-final.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Save final level-end consistency guard before long test
        id: save
        run: |
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$GITHUB_SHA"
          python tools/apply_problem2_final.py
          git diff --check
          git add src/main/java src/validation/java/com/sora/splineroads/Problem2GeometryValidation.java
          git -c user.name='SR checkpoint' -c user.email='sr-checkpoint@users.noreply.github.com' commit -m 'fix: align linked seam preview with explicit level-end and bridge/tunnel fitting rules'
          git push origin HEAD:refs/heads/chat/sr-0402
          test "$(git ls-remote origin refs/heads/chat/sr-0402 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: preserve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preserve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Complete P1 and prior regressions plus real Forge build
        run: bash tools/check_problem2_batch1.sh
      - name: Preserve exact source and logs on success or failure
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-problem2-final-source-logs
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-problem2-final-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
