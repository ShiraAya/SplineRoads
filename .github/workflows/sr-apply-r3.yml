name: Apply reviewed R3 checkpoint once
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-apply-r3.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ShiraAya/SplineRoads' && startsWith(github.event.head_commit.message, 'WIP')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact reviewed source hashes
        run: python3 tools/checkpoints/apply_r3.py
      - name: Save source before long tests
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle tools/test_temporary403.sh tools/model-validation/com/sora/splineroads/world/Temporary403ModelValidation.java
          git commit -m 'WIP: implement temporary lane separation and geometric reopening (R3)'
          git push origin HEAD:refs/heads/chat/sr-0402
          git rev-parse HEAD > /tmp/sr-r3-source-sha
      - name: Core and explicit model regression
        run: |
          set -euo pipefail
          mkdir -p build/checkpoint-logs
          bash tools/test_temporary403.sh 2>&1 | tee build/checkpoint-logs/r3.txt
      - name: Actual Forge compilation
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=2 compileJava compileGameTestJava jar 2>&1 | tee build/checkpoint-logs/forge.txt
      - name: Record tested checkpoint
        run: |
          git fetch origin chat/sr-0402
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/sr-r3-source-sha)"
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/tmp/sr-r3-source-sha').read_text().strip()
          p=Path('PROGRESS.md');old=p.read_text()
          p.write_text('# R3 源码保存与真实CI通过\n\n本轮开始 2026-10-05T12:01:41Z。R3生产保存点：`'+source+'`。\n\n实际通过 tools/test_temporary403.sh 及 JDK17 Forge compileJava / compileGameTestJava / jar。48个三维恢复场景、32个生产规划/记录/删除场景；NBT/world仍是测试适配器，未做客户端/GPU/真实存档重进。保存版本35、协议53，需备份世界及同步更新客户端服务端。\n\n新增问题清单13项已保存至 docs/issues/2026-10-05-user-report.md，仍逐项待修复。R4尚未实现。\n\n---\n\n## 之前阶段记录\n\n'+old)
          PY
          git add PROGRESS.md
          git commit -m 'docs: record R3 saved source and passing real Forge checkpoint'
          git push origin HEAD:refs/heads/chat/sr-0402
      - name: Preserve logs and exact source
        if: always()
        run: |
          mkdir -p build/checkpoint-logs
          git rev-parse HEAD > build/checkpoint-logs/COMMIT.txt
          git archive --format=zip --output=build/checkpoint-logs/SR-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-r3-checkpoint-${{ github.run_id }}
          path: build/checkpoint-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sr-r3-jar-${{ github.run_id }}
          path: build/libs/*.jar
          retention-days: 14
# Staged source transfer replayed locally; before/after hashes remain mandatory.
