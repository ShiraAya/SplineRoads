name: SR patch transport inspection
on:
  push:
    branches: [chat/sr-0402]
    paths: ['.github/workflows/sr-arrival417-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: sr-arrival417-transport
          path: tools/patches/arrival417-stage1.zlib.b64
          retention-days: 2
