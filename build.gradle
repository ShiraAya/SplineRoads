plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'com.sora.splineroads'
version = '0.40.19-alpha-perf1'
base { archivesName = 'splineroads' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets {
    clientValidation {
        java.srcDir 'src/clientvalidation/java'
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
    validation {
        java.srcDir 'src/validation/java'
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
    gameTest {
        java.srcDir 'src/gametest/java'; resources.srcDir 'src/gametest/resources'
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
}
tasks.register('validateNativeBuffers', JavaExec) {
    group = 'verification'
    dependsOn clientValidationClasses
    classpath = sourceSets.clientValidation.runtimeClasspath
    mainClass = 'com.sora.splineroads.client.NativeBufferValidation'
    jvmArgs '-Xmx128m', '-XX:ActiveProcessorCount=2'
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(project.findProperty('roadRunDir') ?: 'run')
            property 'forge.logging.console.level', 'info'
            mods { splineroads { source sourceSets.main } }
        }
        client {
            if(project.hasProperty('roadVisualTest')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.visual38', 'true'
                if(project.hasProperty('roadVisualCases')) property 'road.visual38Cases', project.property('roadVisualCases')
                if(project.hasProperty('roadVisualReload')) property 'road.visual38Reload', project.property('roadVisualReload')
                jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=2'
                args '--width','1440','--height','1000'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            if(project.hasProperty('road429Arrival')) property 'sr.test429.arrival', project.property('road429Arrival')
            jvmArgs '-Xms256m', '-Xmx'+(project.findProperty('roadTestHeap') ?: '4G'), '-XX:ActiveProcessorCount=2'
            mods { splineroads { source sourceSets.gameTest } }
            property 'forge.enabledGameTestNamespaces', project.findProperty('roadTestNamespaces') ?: 'splineroads,splineroads_regression15,splineroads_removal15'
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.20' }
tasks.register('validateStorage292', JavaExec) {
    dependsOn clientValidationClasses
    classpath = sourceSets.clientValidation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.Storage292Validation'
    jvmArgs '-Xmx256m', '-XX:ActiveProcessorCount=2'
    if (project.hasProperty('legacyStorage')) args 'legacy'
}
tasks.register('validateRevision292', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.Revision292Validation'
    jvmArgs '-Xmx1G', '-XX:ActiveProcessorCount=2'
}

tasks.named('check') { dependsOn 'validateRevision38' }
tasks.named('jar', Jar) {
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('THIRD_PARTY_LICENSES') { into 'META-INF/licenses' }
    manifest { attributes 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}


